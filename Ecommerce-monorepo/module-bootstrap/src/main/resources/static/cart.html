<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>장바구니</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">E-Commerce</a>
    </div>
</nav>

<div class="container mt-4">
    <h2>장바구니</h2>
    <table class="table mt-3">
        <thead>
            <tr>
                <th>옵션 ID</th>
                <th>수량</th>
            </tr>
        </thead>
        <tbody id="cartItems">
            </tbody>
    </table>
    <div class="text-end">
        <button class="btn btn-danger" onclick="clearCart()">장바구니 비우기</button>
        <a href="checkout.html" class="btn btn-success">주문하기</a>
    </div>
</div>

<script>
    const baseUrl = 'http://localhost:8080';
    const token = localStorage.getItem('savedToken');

    async function loadCart() {
        try {
            // 장바구니 목록 조회 API 호출 [cite: 225, 231]
            const response = await fetch(`${baseUrl}/api/v1/carts`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const json = await response.json();
            const cartItems = document.getElementById('cartItems');
            cartItems.innerHTML = '';

            const items = json.data;
            for (const [optionId, quantity] of Object.entries(items)) {
                const tr = `
                    <tr>
                        <td>${optionId}</td>
                        <td>${quantity}개</td>
                    </tr>
                `;
                cartItems.insertAdjacentHTML('beforeend', tr);
            }
        } catch (e) {
            console.error('장바구니 로드 실패:', e);
        }
    }

    async function clearCart() {
        try {
            // 장바구니 비우기 API 호출 [cite: 226]
            await fetch(`${baseUrl}/api/v1/carts`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadCart();
        } catch (e) {
            console.error(e);
        }
    }

    loadCart();
</script>
</body>
</html>
