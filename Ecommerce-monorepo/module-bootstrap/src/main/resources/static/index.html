<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>쇼핑몰 메인 - 상품 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">E-Commerce</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <button id="loginBtn" class="btn btn-outline-light btn-sm mt-1 me-3" onclick="testLogin()">테스트 로그인</button>
                </li>
                <li class="nav-item">
                    <span id="userBadge" class="nav-link text-warning font-weight-bold" style="display: none;"></span>
                </li>
                <li class="nav-item"><a class="nav-link" href="cart.html">장바구니</a></li>
                <li class="nav-item"><a class="nav-link" href="mypage.html">마이페이지</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>상품 목록</h2>
    <div class="row" id="productList">
    </div>
</div>

<script>
    const baseUrl = 'http://localhost:8080';
    let token = localStorage.getItem('savedToken');

    // 화면 로드 시 로그인 상태 UI 업데이트
    function updateLoginUI() {
        const btn = document.getElementById('loginBtn');
        const badge = document.getElementById('userBadge');
        if (token) {
            btn.style.display = 'none';
            badge.style.display = 'inline-block';
            badge.innerText = '✅ 1번 유저 로그인됨';
        } else {
            btn.style.display = 'inline-block';
            badge.style.display = 'none';
        }
    }


    // 테스트 로그인(토큰 발급) 함수
    async function testLogin() {
        try {
            const response = await fetch(`${baseUrl}/api/v1/test/token/1`);
            if (!response.ok) throw new Error('토큰 발급 실패');

            const data = await response.text();

            // 응답이 JSON 형식(ApiResponse)일 경우와 단순 Text일 경우 모두 대응
            let tokenToSave = data;
            try {
                const json = JSON.parse(data);
                tokenToSave = json.data || data;
            } catch (e) {
                // 단순 텍스트인 경우 그대로 사용
            }

            localStorage.setItem('savedToken', tokenToSave);
            token = tokenToSave; // 전역 변수 갱신
            updateLoginUI();
            alert("테스트 로그인이 완료되었습니다. 이제 장바구니에 상품을 담을 수 있습니다.");
        } catch (e) {
            console.error(e);
            alert("로그인 처리 중 오류가 발생했습니다. 백엔드 서버 상태를 확인하세요.");
        }
    }

    async function loadProducts() {
        try {
            const response = await fetch(`${baseUrl}/api/v1/products/list?page=1&size=20`);
            const json = await response.json();

            const productList = document.getElementById('productList');
            productList.innerHTML = '';

            json.data.forEach(product => {
                const defaultOptionId = product.options && product.options.length > 0 ? product.options[0].optionId : 1;
                const imageUrl = product.thumbnailUrl ? product.thumbnailUrl : 'https://placeholderjs.com/500x500';

                const card = `
                    <div class="col-md-3 mb-4">
                        <div class="card h-100">
                            <img src="${imageUrl}" class="card-img-top" alt="${product.name}">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${product.name}</h5>
                                <p class="card-text">가격: ${product.price.toLocaleString()}원</p>
                                <p class="card-text text-muted mb-4">${product.description || ''}</p>
                                <button class="btn btn-primary w-100 mt-auto" onclick="addToCart(${product.id}, ${defaultOptionId}, 1)">장바구니 담기</button>
                            </div>
                        </div>
                    </div>
                `;
                productList.insertAdjacentHTML('beforeend', card);
            });
        } catch (e) {
            console.error('상품 목록 로드 실패:', e);
        }
    }

    async function addToCart(productId, optionId, quantity) {
        if (!token) {
            alert("토큰이 없습니다. 우측 상단의 '테스트 로그인' 버튼을 먼저 눌러주세요.");
            return;
        }
        try {
            const response = await fetch(`${baseUrl}/api/v1/carts`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    productId: productId,
                    optionId: optionId,
                    quantity: quantity
                })
            });
            if(response.ok) {
                alert("장바구니에 담겼습니다.");
            } else {
                const errJson = await response.json();
                alert(`장바구니 담기 실패: ${errJson.message || '알 수 없는 오류'}`);
            }
        } catch(e) {
            console.error(e);
        }
    }

    loadProducts();
</script>
</body>
</html>
