<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>주문 및 결제</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">E-Commerce</a>
    </div>
</nav>

<div class="container mt-4">
    <h2>주문 / 결제</h2>
    <div class="card mt-3">
        <div class="card-body">
            <div class="mb-3">
                <label>상품 옵션 ID</label>
                <input type="number" id="optionId" class="form-control" value="1">
            </div>
            <div class="mb-3">
                <label>수량</label>
                <input type="number" id="quantity" class="form-control" value="1">
            </div>
            <div class="mb-3">
                <label>결제 시뮬레이션 금액</label>
                <input type="number" id="amount" class="form-control" value="15000">
            </div>
            <button class="btn btn-primary w-100" onclick="processOrderAndPayment()">주문 생성 및 결제 진행</button>
            
            <div id="result" class="mt-3 alert alert-info" style="display:none;"></div>
        </div>
    </div>
</div>

<script>
    const baseUrl = 'http://localhost:8080';
    const token = localStorage.getItem('savedToken');

    async function processOrderAndPayment() {
        const optionId = document.getElementById('optionId').value;
        const quantity = document.getElementById('quantity').value;
        const amount = document.getElementById('amount').value;
        const resultDiv = document.getElementById('result');

        try {
            // 1. 주문 생성 API 호출 
            const orderRes = await fetch(`${baseUrl}/api/v1/orders`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    orderItems: [{ productOptionId: parseInt(optionId), quantity: parseInt(quantity) }]
                })
            });
            const orderJson = await orderRes.json();
            
            if (!orderRes.ok) throw new Error(orderJson.message);
            const orderId = orderJson.data.orderId; // 반환된 주문 번호 [cite: 746]

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `주문 생성 성공! (OrderID: ${orderId}) <br>결제 승인을 요청합니다...`;

            // 2. 결제 승인 API 호출 [cite: 1003, 1005]
            const paymentRes = await fetch(`${baseUrl}/api/v1/payments/${orderId}/process`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ amount: parseInt(amount) })
            });
            const paymentJson = await paymentRes.json();

            if (!paymentRes.ok) throw new Error(paymentJson.message);
            
            resultDiv.className = 'mt-3 alert alert-success';
            resultDiv.innerHTML += `<br>결제 성공! (상태: ${paymentJson.data.status}, PG-TID: ${paymentJson.data.pgTid})`;

        } catch (e) {
            resultDiv.style.display = 'block';
            resultDiv.className = 'mt-3 alert alert-danger';
            resultDiv.innerHTML = `처리 실패: ${e.message}`;
        }
    }
</script>
</body>
</html>
